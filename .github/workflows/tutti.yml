name: Tutti takip

# DURDURULDU (2026-09-28): Tutti, GitHub Actions sunucularının IP'lerine 403 veriyor.
# Tarama başka bir makinede (ev bilgisayarı / Raspberry Pi / İsviçre sunucusu) çalışana kadar
# sadece elle çalıştırılabilir. Tekrar açmak için schedule satırlarının başındaki # işaretini kaldır.
on:
  # schedule:
  #   - cron: "17 */4 * * *"    # her 4 saatte bir (UTC)
  workflow_dispatch:            # Actions sekmesinden elle çalıştırma

concurrency:
  group: tutti-takip            # iki tarama aynı anda veritabanına yazmasın
  cancel-in-progress: false

permissions:
  contents: write               # veritabanını Release'e yüklemek için

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önceki veritabanını indir
        run: |
          if gh release view veri >/dev/null 2>&1; then
            gh release download veri -p veri.db.gz   # Release varsa indirme başarısız olursa iş durur (veri ezilmesin)
            gunzip -f veri.db.gz
          else
            echo "İlk çalışma: başlangıç veritabanı kullanılıyor"
            gunzip -c veri_baslangic.db.gz > veri.db
          fi

      - name: Tutti tara
        run: python tutti_takip.py 2>&1 | tee tarama.log

      - name: Veritabanını Release'e yükle
        if: ${{ !cancelled() && hashFiles('veri.db') != '' }}
        run: |
          gzip -kf veri.db
          gh release view veri >/dev/null 2>&1 || \
            gh release create veri --title "Tutti veritabanı" \
              --notes "Her taramada otomatik güncellenir. İndirmek için: python veri_indir.py"
          gh release upload veri veri.db.gz --clobber
          [ -f tarama.log ] && gh release upload veri tarama.log --clobber || true

      - name: Tarama başarısızsa işi kırmızıya çevir
        if: ${{ !cancelled() }}
        run: |
          # Kategorilerin yarısından fazlası HATA verdiyse (ör. Tutti erişimi engelledi) iş başarısız görünsün
          hata=$(grep -c "HATA" tarama.log || true)
          echo "HATA satırı: $hata"
          [ "$hata" -lt 30 ]

      - name: Özet
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Tutti taraması'
            echo '```'
            tail -n 70 tarama.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
